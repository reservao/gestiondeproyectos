# Publica la app en GitHub Pages cada vez que se suben cambios.
# Con las variables de Supabase del paso de build, la app usa los datos compartidos.
name: Publicar en GitHub Pages

on:
  push:
    branches: [claude/determined-tesla-gfwxu1, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Proyecto de Supabase del piloto. Ambos valores son públicos por diseño
          # (quedan dentro de la app que descarga el navegador); la seguridad la dan
          # el registro desactivado y las políticas de la base (ver docs/piloto.md).
          VITE_SUPABASE_URL: https://flcnrkxypihxkaqgcrad.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_Y5lr_jfBn_Z3xUoVXUM89Q_IDCfTxRa
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
